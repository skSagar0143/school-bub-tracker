spring.application.name=bus-tracker
server.port=8080
server.servlet.context-path=/sm

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT RS256. Keep PEM files outside Git in backend/bus-tracker/secrets/.
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:./secrets/private_key.pem}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:./secrets/public_key.pem}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Frontend development origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Initial School Admin bootstrap (enable only for first local setup).
# Supply the password via APP_BOOTSTRAP_ADMIN_PASSWORD; never commit it.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:saurabh@gamil.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Saurabh Kumar}



# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

