name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - "backend/bus-tracker/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/bus-tracker/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/bus-tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
